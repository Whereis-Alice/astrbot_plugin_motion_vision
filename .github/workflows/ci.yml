name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: python -m pip install --upgrade pip pillow httpx ruff pytest
      - name: 代码检查
        run: |
          ruff check .
          ruff format --check .
      - name: 单元测试
        run: pytest -q
